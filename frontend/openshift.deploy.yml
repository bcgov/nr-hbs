---
# Frontend deploy Template — consumed by `oc process` in reusable-deploy.yml.
#
# VITE_* values are injected into /srv/config.js by docker-entrypoint.sh at
# container start (runtime config). The Vite-built bundle is env-agnostic;
# the same image binary serves DEV preview, TEST, and PROD.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nr-hbs-frontend-deploy
parameters:
  - name: NAME
    description: App name prefix
    value: nr-hbs
  - name: ZONE
    description: PR number, 'test', or 'prod'
    required: true
  - name: REPLICAS
    description: Pod count; PR previews get 1 via lite_mode, TEST=2, PROD=3
    value: "2"
  - name: IMAGE_TAG
    description: Container image tag (PR number, 'test', or 'prod')
    value: latest
  - name: REGISTRY
    description: Image registry path (no tag)
    value: ghcr.io/bcgov/nr-hbs/frontend
  - name: FRONTEND_LOG_LEVEL
    value: INFO
  # Runtime VITE_* config (rendered into /srv/config.js by the entrypoint
  # and read at SPA boot via src/env.ts — see docker-entrypoint.sh).
  # BC Gov SSO (Keycloak) — same as nr-fta. The issuer URI is all
  # oidc-client-ts needs; it discovers the authorize, token and end-session
  # endpoints from there. Redirect URIs are derived from the runtime origin.
  - name: VITE_KEYCLOAK_URL
    description: Realm issuer URI, e.g. https://test.loginproxy.gov.bc.ca/auth/realms/standard
    required: true
  # Must match KEYCLOAK_CLIENT_ID on the backend: it is checked there as the
  # token's `azp`, so a mismatch refuses every request.
  - name: VITE_KEYCLOAK_CLIENT_ID
    description: The CSS integration's client id
    required: true
  - name: VITE_API_BASE_URL
    description: Browser-facing API base path; usually '/api'
    value: /api
  - name: VITE_APP_NAME
    value: Harvest Billing System

objects:
  # ── Deployment ────────────────────────────────────────────
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/name: ${NAME}-frontend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      replicas: ${{REPLICAS}}
      selector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      template:
        metadata:
          labels:
            app: ${NAME}-frontend-${ZONE}
            app.kubernetes.io/instance: ${ZONE}
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
          initContainers:
            - name: seed-srv
              image: ${REGISTRY}:${IMAGE_TAG}
              command:
                - sh
                - -c
                - 'cp -r /srv/. /srv-rw/'
              volumeMounts:
                - name: srv
                  mountPath: /srv-rw
              resources:
                requests:
                  cpu: "20m"
                  memory: "32Mi"
                  ephemeral-storage: "50Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
                  ephemeral-storage: "100Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: ${NAME}-frontend
              image: ${REGISTRY}:${IMAGE_TAG}
              ports:
                - name: http
                  containerPort: 3000
                - name: health
                  containerPort: 3001
              env:
                - name: LOG_LEVEL
                  value: ${FRONTEND_LOG_LEVEL}
                # Caddy reverse-proxies /api* to the same-zone backend Service.
                - name: BACKEND_URL
                  value: http://${NAME}-backend-${ZONE}:8080
                - name: XDG_DATA_HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp
                - name: VITE_KEYCLOAK_URL
                  value: ${VITE_KEYCLOAK_URL}
                - name: VITE_KEYCLOAK_CLIENT_ID
                  value: ${VITE_KEYCLOAK_CLIENT_ID}
                - name: VITE_API_BASE_URL
                  value: ${VITE_API_BASE_URL}
                - name: VITE_APP_NAME
                  value: ${VITE_APP_NAME}
              
  # ── Service ───────────────────────────────────────────────
  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      selector:
        app: ${NAME}-frontend-${ZONE}
      ports:
        - name: http
          protocol: TCP
          port: 3000
          targetPort: 3000

  # ── Route ─────────────────────────────────────────────────
  # The public Route lives in its own templates so it can be applied per env:
  #   • non-PROD (TEST + PR previews) → frontend/openshift.route.yml
  #   • PROD → frontend/openshift.vanity-route.yml ONLY (no default route)
  # Both are gated in reusable-deploy.yml.

  # ── NetworkPolicy: ingress from OpenShift router ───────────
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-frontend-${ZONE}-ingress
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      podSelector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress

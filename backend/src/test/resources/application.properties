spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
logging.level.ca.bc.gov.nrs.hbs.api=DEBUG
spring.main.allow-bean-definition-overriding=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://bc.ca
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://bc.ca/protocol/openid-connect/certs
hbs.keycloak.client-id=hbs-test-client
spring.mail.host=localhost
spring.mail.port=25
hbs.mail.from=test@gov.bc.ca
hbs.mail.support=test@gov.bc.ca

# Logging — env vars map directly to Spring's relaxed-binding form
# (LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY etc.). Set via the OpenShift
# deployment env.
logging.level.ca.bc.gov.nrs.hbs.api=${APP_LOG_LEVEL:INFO}

# DB — the shared BC Gov Oracle THE schema (same instance + conventions as
# nr-fsp-new). TCPS = TLS-wrapped Oracle net protocol on the NRS 1543 listener.
spring.datasource.url=jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS=(PROTOCOL=TCPS)(HOST=${DATABASE_HOST})(PORT=${DATABASE_PORT:1543}))(CONNECT_DATA=(SERVICE_NAME=${DATABASE_SERVICE_NAME})(SERVER=DEDICATED)))
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Oracle TLS trust — keystore assembled by the init container, mounted at /cert.
spring.datasource.hikari.data-source-properties.javax.net.ssl.trustStoreType=JKS
spring.datasource.hikari.data-source-properties.javax.net.ssl.trustStore=/cert/jssecacerts
spring.datasource.hikari.data-source-properties.javax.net.ssl.trustStorePassword=${KEYSTORE_SECRET}
# Pool settings carried over verbatim from nr-fsp-new (see the long comment
# there): minimum-idle=1 keeps idle PR-preview pods to one session so we don't
# exhaust SESSIONS_PER_USER; 30-minute max-lifetime avoids TCPS logon storms.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# The HBS procs parse 'yyyy-mm-dd' date strings and expect '.' decimals —
# pin both on every pooled connection (same reason as nr-fsp-new).
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET NLS_NUMERIC_CHARACTERS = '.,' NLS_DATE_FORMAT = 'YYYY-MM-DD'

# BC Gov SSO (Keycloak) standard realm — same wiring as nr-fta / nr-rept, e.g.
# https://test.loginproxy.gov.bc.ca/auth/realms/standard. Keycloak publishes its
# keys at /protocol/openid-connect/certs, NOT /.well-known/jwks.json.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs
# The CSS integration's client id. Tokens must carry it as `azp`
# (AuthorizedPartyValidator) or the API would accept any token the shared
# realm signs, for any client. Must equal the SPA's VITE_KEYCLOAK_CLIENT_ID.
hbs.keycloak.client-id=${KEYCLOAK_CLIENT_ID}

# nr-user-lookup-api — IDIR/BCeID directory for the user picker and
# display-name enrichment of audit columns. Client-credentials token from
# HBS's own Keycloak service account in the *forests* realm (token-url is
# <KEYCLOAK_SA_ISSUER_URI>/protocol/openid-connect/token — NOT the standard
# realm above). Blank base-url = lookups no-op.
hbs.user-lookup.base-url=${USER_LOOKUP_BASE_URL:}
hbs.user-lookup.token-url=${USER_LOOKUP_TOKEN_URL:}
hbs.user-lookup.client-id=${USER_LOOKUP_CLIENT_ID:}
hbs.user-lookup.client-secret=${USER_LOOKUP_CLIENT_SECRET:}
hbs.user-lookup.scope=${USER_LOOKUP_SCOPE:}

# nr-forest-client-api — forest client search / lookup for the client picker
# and the active org's name. Base URL is scheme + host (paths start at
# /api/clients), e.g. https://nr-forest-client-api-test.api.gov.bc.ca; the
# API key comes from the API Services Portal (api.gov.bc.ca) and is sent as
# X-API-KEY. Blank base-url = client lookups answer 503 "not configured".
hbs.forest-client-api.base-url=${FOREST_CLIENT_API_URL:}
hbs.forest-client-api.api-key=${FOREST_CLIENT_API_KEY:}

# ClamAV virus scanning of uploaded scale-return XML files (the P505
# "Submit File of Detail Returns" replacement). clamd over raw TCP INSTREAM.
# fail-open=false ⇒ a scanner outage rejects uploads (fail-CLOSED).
hbs.clamav.enabled=${CLAMAV_ENABLED:true}
hbs.clamav.host=${CLAMAV_HOST:}
hbs.clamav.port=${CLAMAV_PORT:3310}
hbs.clamav.fail-open=${CLAMAV_FAIL_OPEN:false}
hbs.clamav.connect-timeout=${CLAMAV_CONNECT_TIMEOUT:5s}
hbs.clamav.read-timeout=${CLAMAV_READ_TIMEOUT:30s}
hbs.clamav.chunk-size=8192

# JasperReports scratch dir — compiled .jasper subreports + logos are staged
# here per report (emptyDir /temp in OpenShift; root FS is read-only).
hbs.reports.work-dir=${REPORTS_WORK_DIR:/temp/hbs-reports}

# Shared volume that replaces the legacy XMLinput / XMLarchive SMB
# shares: submitted scale-data XML lands in <root>/input/<client>/<id>.xml for
# the intake job (SubmissionStorage). In OpenShift a ReadWriteMany PVC
# (backend/openshift.deploy.yml). See docs/file-shares-and-storage.md.
hbs.storage.xml-root=${HBS_STORAGE_XML_ROOT:/data/hbs/xml}

# Application banner — the legacy "alert text file" on the ProcessParam share,
# now a DB-backed setting edited from Administration › Processing Parameters.
hbs.alert.enabled=true

spring.jackson.deserialization.fail-on-unknown-properties=false
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.enabled=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
spring.jmx.enabled=false
logging.file.name=/logs/app.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.clean-history-on-start=true
logging.logback.rollingpolicy.max-history=1
logging.pattern.file={"time_stamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%3p" ,"thread":"%t" ,"class":"%logger{36}","msg":"%replace(%msg){'[\n\r\"]',''}", "exception":"%replace(%rEx{10}){'[\n\r\"]',''}","http_event":%X{httpEvent:-""}}%nopex%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} | [%5p] | [%t] | [%logger{36}] | [%replace(%msg){'[\n\r\"]',''} %X{httpEvent}] | %replace(%rEx{10}){'[\n\r\"]',''}%nopex%n

# Scale-return XML files from scale sites can be large (a day's weigh slips).
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB
server.undertow.max-http-post-size=115343360

# Outbound mail via the BC Gov internal SMTP relay (no auth / STARTTLS).
spring.mail.host=${SMTP_HOST:apps.smtp.gov.bc.ca}
spring.mail.port=${SMTP_PORT:25}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
hbs.mail.from=${HBS_MAIL_FROM:FORHVAP.HBSHELP@gov.bc.ca}
# Kill-switch for all outbound email (batch failure alerts, statement-ready
# notices). ON by default; set EMAIL_SEND_ENABLED=false to keep an env silent.
hbs.mail.send-enabled=${EMAIL_SEND_ENABLED:true}
hbs.mail.support=${HBS_SUPPORT_EMAIL:FORHVAP.HBSSUPRT@gov.bc.ca}

# Batch jobs — the legacy hbs-batch / AutoMate jobs re-hosted as ShedLock-
# coordinated @Scheduled jobs (THE.HBS_SHEDLOCK). ALL OFF by default: the
# legacy batch keeps running until cut-over, and two invoicing runs against
# the same returns would double-bill. See docs/batch-jobs.md.
hbs.batch.enabled=${HBS_BATCH_ENABLED:false}
hbs.batch.zone=${HBS_BATCH_ZONE:America/Vancouver}
hbs.batch.xml-intake.cron=${HBS_BATCH_XML_INTAKE_CRON:0 */15 * * * *}
hbs.batch.anomaly-audit.cron=${HBS_BATCH_ANOMALY_CRON:0 0 3 * * *}
hbs.batch.purge.cron=${HBS_BATCH_PURGE_CRON:0 30 4 * * *}
